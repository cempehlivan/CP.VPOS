name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: "Canlı banka test ortamlarına istek atan entegrasyon testlerini de çalıştır"
        type: boolean
        default: false

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test (birim)
      run: dotnet test --no-build --verbosity normal --filter "TestCategory!=Integration"
    - name: Test (entegrasyon)
      if: github.event_name == 'workflow_dispatch' && inputs.run_integration_tests
      run: dotnet test --no-build --verbosity normal --filter "TestCategory=Integration"
